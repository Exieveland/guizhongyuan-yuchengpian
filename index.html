<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>柜中缘·渝城篇 — 互动情境小说</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{font-family:"PingFang SC","Microsoft YaHei","Helvetica Neue",sans-serif;background:#1a1410;color:#e8ddd0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px 16px 40px;}
#game-container{max-width:600px;width:100%;background:#2a221e;border-radius:16px;box-shadow:0 8px 40px rgba(0,0,0,0.6);padding:24px 20px 28px;border:1px solid #4a3c34;position:relative;}
#scene-title{font-size:15px;color:#b8a090;letter-spacing:2px;margin-bottom:6px;text-align:center;}
#scene-sub{font-size:13px;color:#8a7a6e;text-align:center;margin-bottom:18px;}
#scene-image{width:100%;height:180px;background:linear-gradient(135deg,#3d2e24,#2a1e16);border-radius:12px;margin-bottom:18px;display:flex;align-items:center;justify-content:center;font-size:48px;color:#8a7a6e;border:1px solid #4a3c34;}
#scene-text{font-size:16px;line-height:1.9;color:#dccfc4;margin-bottom:22px;padding:0 4px;text-align:left;}
#scene-text .highlight{color:#e8b88a;font-weight:500;}
#scene-text .dialog{color:#c4b0a0;font-style:italic;}
#choices{display:flex;flex-direction:column;gap:12px;}
.choice-btn{background:#3d3028;border:1px solid #5a4a3e;color:#e8ddd0;padding:14px 18px;border-radius:12px;font-size:15px;line-height:1.5;text-align:left;cursor:pointer;transition:all 0.2s;}
.choice-btn:active{transform:scale(0.97);background:#4d3c32;border-color:#b89070;}
.choice-btn:hover{background:#4d3c32;border-color:#b89070;}
.choice-btn.disabled{opacity:0.5;pointer-events:none;}
#status-bar{display:none;background:#1e1814;border-radius:10px;padding:12px 16px;margin-bottom:18px;font-size:13px;color:#b8a090;gap:16px;flex-wrap:wrap;}
#status-bar .stat{display:inline-flex;align-items:center;gap:6px;}
#status-bar .stat-value{color:#e8b88a;font-weight:600;}
#inventory{display:inline-flex;align-items:center;gap:6px;margin-left:auto;}
#inventory .item{background:#3d3028;padding:2px 10px;border-radius:6px;font-size:12px;color:#dccfc4;}
#footer{text-align:center;margin-top:20px;font-size:12px;color:#5a4a3e;}
#restart-btn{background:transparent;border:1px solid #5a4a3e;color:#8a7a6e;padding:8px 24px;border-radius:8px;font-size:13px;cursor:pointer;transition:all 0.2s;margin-top:8px;}
#restart-btn:active{background:#3d3028;color:#e8ddd0;}
@media(max-width:480px){#game-container{padding:18px 14px 22px;}#scene-text{font-size:15px;line-height:1.8;}.choice-btn{padding:12px 14px;font-size:14px;}}
</style>
</head>
<body>
<div id="game-container">
<div id="scene-title">柜中缘 · 渝城篇</div>
<div id="scene-sub">一桩因"柜"而起的乱世奇缘</div>
<div id="scene-image">🏮</div>
<div id="status-bar">
<span class="stat">❤️ 岳雷好感: <span id="stat-yue" class="stat-value">0</span></span>
<span class="stat">🤝 哥哥信任: <span id="stat-brother" class="stat-value">0</span></span>
<span class="stat">🔍 搜查严格度: <span id="stat-search" class="stat-value">0</span></span>
<span id="inventory"></span>
</div>
<div id="scene-text"></div>
<div id="choices"></div>
<button id="restart-btn" onclick="restartGame()">🔄 重新开始</button>
<div id="footer">渝言创——巴渝方言互动教学平台</div>
</div>
<script>
// ========== 游戏状态 ==========
let state = {
  yueLikes: 0,       // 岳雷好感度
  brotherTrust: 0,   // 哥哥信任值
  searchStrict: 0,   // 搜查严格度
  inventory: [],     // 道具列表
  currentNode: 'start',
  flags: {},         // 自定义标记
  history: [],       // 访问历史
  ending: null
};

// ========== 节点定义 ==========
const nodes = {};

// ========== 工具函数 ==========
function updateStatusBar(){
  document.getElementById('stat-yue').textContent = state.yueLikes;
  document.getElementById('stat-brother').textContent = state.brotherTrust;
  document.getElementById('stat-search').textContent = state.searchStrict;
  const invContainer = document.getElementById('inventory');
  if(state.inventory.length > 0){
    invContainer.innerHTML = '🎒 ' + state.inventory.map(i => `<span class="item">${i}</span>`).join('');
  } else {
    invContainer.innerHTML = '';
  }
}

function showStatusBar(show){
  document.getElementById('status-bar').style.display = show ? 'flex' : 'none';
}

function goToNode(nodeId){
  state.currentNode = nodeId;
  state.history.push(nodeId);
  const node = nodes[nodeId];
  if(!node){
    document.getElementById('scene-text').innerHTML = '（剧情加载中……）';
    document.getElementById('choices').innerHTML = '';
    return;
  }
  // 更新标题与文本
  document.getElementById('scene-title').textContent = node.title || '柜中缘 · 渝城篇';
  document.getElementById('scene-sub').textContent = node.subtitle || '';
  document.getElementById('scene-image').textContent = node.icon || '🏮';
  // 应用入场触发
  if(node.onEnter) node.onEnter();
  // 渲染文本（支持HTML）
  document.getElementById('scene-text').innerHTML = node.text;
  // 渲染选项
  const choicesContainer = document.getElementById('choices');
  choicesContainer.innerHTML = '';
  if(node.choices && node.choices.length > 0){
    node.choices.forEach((choice, index) => {
      const btn = document.createElement('button');
      btn.className = 'choice-btn';
      btn.textContent = choice.text;
      // 条件判断
      if(choice.condition && !choice.condition()){
        btn.classList.add('disabled');
      } else {
        btn.addEventListener('click', function(){
          if(choice.effect) choice.effect();
          if(choice.next) goToNode(choice.next);
        });
      }
      choicesContainer.appendChild(btn);
    });
  }
  updateStatusBar();
}

function restartGame(){
  state = {
    yueLikes: 0,
    brotherTrust: 0,
    searchStrict: 0,
    inventory: [],
    currentNode: 'start',
    flags: {},
    history: [],
    ending: null
  };
  showStatusBar(true);
  goToNode('start');
}

// 启动游戏
window.onload = function(){ restartGame(); };

// ========== 剧本节点 ==========

// ---- 开场 / 启动节点 ----
nodes.start = {
  title: '柜中缘 · 渝城篇',
  subtitle: '一桩因"柜"而起的乱世奇缘',
  icon: '🏮',
  text: '都说乱世难安生，这几日城门口查得紧得很，说是在追啥子忠良之后。<br><br><span class="highlight">重庆城郊·农家小院</span><br>竹篱笆围到半畦青菜，堂屋窗子底下，你——<span class="highlight">刘玉莲</span>——正坐到纳鞋底。<br>妈一早就去邻村走人户了，哥哥那个猴娃子赶场卖柴去了，要擦黑才回得来。<br><br>你个姑娘家家的，只盼到屋头平平安安的，哥哥少闯点祸。<br><br><span class="dialog">（这时候，院坝外头传来脚步声……）</span>',
  choices: [
    { text: '▶ 进入第一幕 · 小院闲居', next: 'm1_intro' }
  ]
};

// ---- 第一幕：小院闲居 ----
nodes.m1_intro = {
  title: '第一幕 · 院坝头',
  subtitle: '晌午时候 · 农家院坝',
  icon: '🌿',
  text: '院坝头的张婆婆路过，隔到篱笆喊：<br><br><span class="dialog">"玉莲呐，你妈走之前喊我跟你说，灶上温到红苕稀饭的，莫搞忘了哈！"</span><br><br><span class="highlight">【方言俚语热身关】</span><br>题目：<span class="highlight">"搞忘了"</span>在重庆话里头是啥子意思？',
  choices: [
    { text: 'A. 搞忘记咯/忘咯', effect: function(){ state.yueLikes += 1; state.brotherTrust += 1; }, next: 'm1_warmup_correct' },
    { text: 'B. 搞懂咯/明白咯', next: 'm1_warmup_wrong1' },
    { text: 'C. 搞砸咯/整坏咯', next: 'm1_warmup_wrong2' }
  ]
};

nodes.m1_warmup_correct = {
  title: '✅ 答对咯！',
  subtitle: '你是个地地道道的重庆妹儿',
  icon: '✨',
  text: '你应了一声："晓得咯张婆婆，我记到的咯！"<br><br>张婆婆摆了摆手走了。你笑了下，硬是差点搞忘了——妈走之前特意交代到的。<br><br><span class="highlight">（俚语小贴士："搞忘了"＝搞忘记咯、忘咯。重庆人天天挂到嘴巴头说。）</span><br><br>你正要回屋头舀稀饭，忽然听到院门口传来一阵急得很的脚步声——不像平时过路的人，倒像是有人在跑。<br><br>你放下针线，走到门边，从门缝缝头往外头瞄了一眼——<br><br>一个年轻男子，衣裳上头沾到血，正靠在你们家篱笆边上喘大气。',
  choices: [ { text: '▶ 继续', next: 'm1_meet_yue' } ]

  choices: [ { text: '▶ 继续', next: 'm1_meet_yue' } ]
};

nodes.m1_meet_yue = {
  title: '初遇 · 不请自来的客',
  subtitle: '院坝外头 · 脚步声急',
  icon: '🚪',
  text: '那个人一抬头，正对到你从门缝缝头露出来的眼光。<br><br>他大概二十出头，脸盘子长得周正，眉毛眼睛都硬朗，就是一脸疲惫和着急。身上那件青衫破了好几处，袖口隐隐约约还有血印子。<br>他把声音压得很低，气都没喘匀净：<br><br><span class="dialog">"姑娘……在下遭人追，能不能……借你屋头躲一哈？"</span><br><br>远处隐隐约约传来人声和脚步声，好像正在往这边拢。<br><br>你心头上咯噔一下——这个人看起来不像坏人，但万一他就是官府在追的那个"忠良之后"……<br>你啷个办？',
  choices: [
    { text: '🚪 开门让他进来', effect: function(){ state.yueLikes += 2; state.searchStrict += 1; }, next: 'm1_let_in' },
    { text: '🤔 先问清楚他是哪个再开门', effect: function(){ state.yueLikes += 1; }, next: 'm1_ask_first' },
    { text: '😰 装到屋头没人，不出声', next: 'm1_ignore' }
  ]
};

nodes.m1_let_in = {
  title: '开门 · 一念之善',
  subtitle: '你做了选择',
  icon: '🚪✨',
  text: '你咬了咬牙，飞快地拉开门栓，一把将那个人拉了进来，反手又把门闩上。<br><br>他踉跄了一哈，低声道："多谢姑娘……在下岳雷，不敢连累姑娘，只求躲一哈哈就走。"<br><br>岳雷——你心里头一紧。前几天城里贴的告示，说要追拿的不就是岳家后人么？<br><br>可你都把他拉进来了，总不能这时候又把他赶出去吧。<br><br>远处的人声越来越近了。<br><br><span class="highlight">你得赶紧找个地方把他藏起来。</span>',
  choices: [ { text: '▶ 藏他到屋里去', next: 'm2_hide_choice' } ]
};

nodes.m1_ask_first = {
  title: '谨慎 · 问清来历',
  subtitle: '门里门外',
  icon: '🤝',
  text: '你把声音压低了问："你是哪个？啷个弄成这个样子的？"<br><br>他气都没喘匀就答了："在下姓岳，单名一个雷字。遭官府的人追了一路了……姑娘，再不走我就要连累你了。"<br><br>姓岳——你心头一凛。硬是那个被追拿的岳家后人。<br><br>可看他这个样子，也确实造孽。远处脚步声快要到了，你若不帮他，他今天怕是跑不脱了。',
  choices: [
    { text: '🚪 开门让他进来', effect: function(){ state.yueLikes += 2; state.searchStrict += 1; }, next: 'm1_let_in' },
    { text: '😰 还是算咯，抱歉帮不到你', effect: function(){ state.yueLikes -= 1; }, next: 'm1_refuse' }
  ]
};

nodes.m1_ignore = {
  title: '装到没看到 · 闭门不出',

nodes.m2_hide_choice = {

  choices: [
    { text: '📦 藏进大衣柜', effect: function(){ state.yueLikes += 1; state.searchStrict += 1; state.flags.hideSpot = 'wardrobe'; }, next: 'm2_hide_wardrobe' },
    { text: '🪵 藏进柴房', effect: function(){ state.yueLikes += 1; state.flags.hideSpot = 'woodshed'; }, next: 'm2_hide_woodshed' },

  ]
};

// 大衣柜分支
nodes.m2_hide_wardrobe = {

nodes.m2_hide_bed = {
