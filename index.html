<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>柜中缘·渝城篇 — 互动漫剧</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{font-family:"PingFang SC","Microsoft YaHei",sans-serif;background:#0d0a08;color:#e8ddd0;min-height:100vh;display:flex;justify-content:center;}
#game{width:100%;max-width:480px;background:#000;position:relative;min-height:100vh;display:flex;flex-direction:column;}
#frame{position:relative;width:100%;aspect-ratio:9/14;max-height:62vh;overflow:hidden;background:#1a1410;}
#frame img{width:100%;height:100%;object-fit:cover;display:block;}
#frame .shade{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,0.1) 0%,rgba(0,0,0,0.55) 70%,rgba(0,0,0,0.92) 100%);}
#frame .caption{position:absolute;left:0;right:0;bottom:0;padding:14px 18px 10px;}
#scene-title{font-size:13px;color:#d4b896;letter-spacing:3px;}
#scene-sub{font-size:11px;color:#8a7a6e;margin-top:2px;}
#panel{flex:1;background:#1a1410;padding:16px 18px 24px;overflow-y:auto;}
#status-bar{display:none;background:#0f0b09;border-radius:10px;padding:10px 14px;margin-bottom:14px;font-size:12px;color:#b8a090;gap:12px;flex-wrap:wrap;align-items:center;}
#status-bar .stat-value{color:#e8b88a;font-weight:600;}
#inventory{display:inline-flex;gap:6px;margin-left:auto;flex-wrap:wrap;}
#inventory .item{background:#3d3028;padding:2px 8px;border-radius:6px;font-size:11px;color:#dccfc4;}
#text{font-size:15px;line-height:1.85;color:#dccfc4;margin-bottom:16px;}
#text .hl{color:#e8b88a;font-weight:500;}
#text .dlg{color:#c9b5a4;}
#choices{display:flex;flex-direction:column;gap:10px;}
.choice{background:#2e241d;border:1px solid #4a3a30;color:#e8ddd0;padding:13px 15px;border-radius:11px;font-size:14px;line-height:1.45;text-align:left;cursor:pointer;transition:all .15s;}
.choice:active{transform:scale(.98);background:#3d2f26;border-color:#b89070;}
.choice.disabled{opacity:.45;pointer-events:none;}
#restart{display:block;margin:14px auto 0;background:transparent;border:1px solid #4a3c34;color:#8a7a6e;padding:7px 22px;border-radius:8px;font-size:12px;cursor:pointer;}
</style>
</head>
<body>
<div id="game">
  <div id="frame">
    <img id="frame-img" src="">
    <div class="shade"></div>
    <div class="caption">
      <div id="scene-title"></div>
      <div id="scene-sub"></div>
    </div>
  </div>
  <div id="panel">
    <div id="status-bar">
      <span>好感 <b class="stat-value" id="s-yue">0</b></span>
      <span>信任 <b class="stat-value" id="s-bro">0</b></span>
      <span>搜查 <b class="stat-value" id="s-src">0</b></span>
      <span id="inventory"></span>
    </div>
    <div id="text"></div>
    <div id="choices"></div>
    <button id="restart" onclick="restart()">重新开始</button>
  </div>
</div>
<script>
const IMG = {
  start:"https://aka.doubaocdn.com/s/FLpvwEHUja",
  zhang:"https://aka.doubaocdn.com/s/3Uvvv8pvSx",
  meet:"https://aka.doubaocdn.com/s/Qgaso4AJIi",
  letin:"https://aka.doubaocdn.com/s/MUrxkgje5q",
  ward_ext:"https://aka.doubaocdn.com/s/avjC3dwSoc",
  ward_in:"https://aka.doubaocdn.com/s/vBayXHqQgp",
  wood:"https://aka.doubaocdn.com/s/Uw1TFkRSXb",
  bed:"https://aka.doubaocdn.com/s/HoK0i9GP2G",
  cops:"https://aka.doubaocdn.com/s/FeLVeELa7U",
  brother:"https://aka.doubaocdn.com/s/C5AV3gxtIm",
  pendant:"https://aka.doubaocdn.com/s/FWyNVyoTxy",
  woodsel:"https://aka.doubaocdn.com/s/N4vTLsS48g",
  courier:"https://aka.doubaocdn.com/s/5nfWjcXPnr",
  parting:"https://aka.doubaocdn.com/s/6pVR2gdqqV",
  caught:"https://aka.doubaocdn.com/s/O6M9nSVQtv",
  restless:"https://aka.doubaocdn.com/s/TavawNw5gV",
  grab:"https://aka.doubaocdn.com/s/8HBDgmJDUq",
  reunion:"https://aka.doubaocdn.com/s/fclJBhDSN0",
  letter:"https://aka.doubaocdn.com/s/YXp0vavayb",
  wander:"https://aka.doubaocdn.com/s/c5QOqiViR8",
  siblings:"https://aka.doubaocdn.com/s/TRTT434C3V",
  empty:"https://aka.doubaocdn.com/s/058TXuCtMd"
};
let state, nodes={};
function updBar(){
  document.getElementById('s-yue').textContent=state.yue;
  document.getElementById('s-bro').textContent=state.bro;
  document.getElementById('s-src').textContent=state.src;
  const inv=document.getElementById('inventory');
  inv.innerHTML = state.inv.length? state.inv.map(i=>`<span class="item">${i}</span>`).join('') : '';
}
function showBar(s){document.getElementById('status-bar').style.display=s?'inline-flex':'none';}
function go(id){
  state.cur=id; state.hist.push(id);
  const n=nodes[id]; if(!n)return;
  document.getElementById('scene-title').textContent=n.title||'柜中缘';
  document.getElementById('scene-sub').textContent=n.subtitle||'';
  if(n.img) document.getElementById('frame-img').src=n.img;
  if(n.onEnter) n.onEnter();
  document.getElementById('text').innerHTML=n.text||'';
  const box=document.getElementById('choices'); box.innerHTML='';
  (n.choices||[]).forEach(c=>{
    const b=document.createElement('button'); b.className='choice'; b.textContent=c.text;
    if(c.cond && !c.cond()){b.classList.add('disabled');}
    else b.onclick=()=>{ if(c.eff)c.eff(); if(c.next)go(c.next); };
    box.appendChild(b);
  });
  updBar();
}
function restart(){
  state={yue:0,bro:0,src:0,inv:[],flags:{},ending:null,cur:'start',hist:[]};
  showBar(true); go('start');
}
window.onload=restart;

// ===== 节点 =====
nodes.start={
  title:"柜中缘 · 渝城篇", subtitle:"一桩因「柜」而起的乱世奇缘", img:IMG.start,
  text:"都说乱世难安生，这几日城门口查得紧，说是在追啥子忠良之后。<br><br><span class='hl'>重庆城郊·农家小院</span><br>竹篱笆围到半畦青菜，堂屋窗子底下，你——<span class='hl'>刘玉莲</span>——正坐到纳鞋底。<br>妈一早就去邻村走人户了，哥哥赶场卖柴，要擦黑才回。<br><br><span class='dlg'>（这时候，院坝外头传来脚步声……）</span>",
  choices:[{text:"▶ 进入第一幕 · 小院闲居",next:"m1"}]
};

nodes.m1={
  title:"第一幕 · 院坝头", subtitle:"晌午时候", img:IMG.zhang,
  text:"院坝头的张婆婆路过，隔到篱笆喊：<br><br><span class='dlg'>「玉莲呐，你妈走之前喊我跟你说，灶上温到红苕稀饭的，莫搞忘了哈！」</span><br><br><span class='hl'>【方言热身】「搞忘了」在重庆话里是啥子意思？</span>",
  choices:[
    {text:"A. 搞忘记咯 / 忘咯",eff:()=>{state.yue++;state.bro++;},next:"m1ok"},
    {text:"B. 搞懂咯 / 明白咯",next:"m1w1"},
    {text:"C. 搞砸咯 / 整坏咯",next:"m1w2"}
  ]
};
nodes.m1ok={title:"✅ 答对咯",subtitle:"地地道道的重庆妹儿",img:IMG.zhang,
  text:"你应道：「晓得咯张婆婆，我记到的！」<br>张婆婆摆手走了。你正要回屋舀稀饭，院门口忽然传来急得很的脚步声——不像过路的，倒像是有人在跑。<br><br>你放下针线，从门缝缝往外瞄——<br>一个年轻男子，衣裳上头沾到血，正靠在你家篱笆边上喘大气。",
  choices:[{text:"▶ 继续",next:"meet"}]
};
nodes.m1w1={title:"❌ 答错咯",subtitle:"好生想哈",img:IMG.zhang,
  text:"张婆婆愣了：「你这女娃儿，我说莫搞忘了，你啷个扯到搞懂咯去了嘛？」<br><span class='hl'>（「搞忘了」＝搞忘记咯。）</span><br><br>你讪讪一笑，忽然听到院门口急得很的脚步声——一个沾血的年轻人靠在篱笆边喘大气。",
  choices:[{text:"▶ 继续",next:"meet"}]
};
nodes.m1w2={title:"❌ 答错咯",subtitle:"差一哈哈",img:IMG.zhang,
  text:"张婆婆摆手：「搞忘了就是搞忘了嘛，又不是搞砸咯！」<br><span class='hl'>（「搞忘了」＝搞忘记咯。）</span><br><br>你笑着应了，忽然院门口传来脚步声——一个沾血的年轻人靠在篱笆边喘气。",
  choices:[{text:"▶ 继续",next:"meet"}]
};

nodes.meet={title:"初遇 · 不请自来的客",subtitle:"院坝外头",img:IMG.meet,
  text:"他一抬头，正对到你从门缝缝露出来的眼光。<br><br>二十出头，脸盘周正，眉眼硬朗，一脸疲惫着急。青衫破了好几处，袖口隐隐有血印。他压低声：<br><br><span class='dlg'>「姑娘……在下遭人追，能不能……借你屋头躲一哈？」</span><br><br>远处人声脚步声正往这边拢。你啷个办？",
  choices:[
    {text:"🚪 开门让他进来",eff:()=>{state.yue+=2;state.src++;},next:"letin"},
    {text:"🤔 先问清楚他是哪个",eff:()=>{state.yue+=1;},next:"ask"},
    {text:"😰 装到屋头没人，不出声",next:"ignore"}
  ]
};
nodes.ask={title:"谨慎 · 问清来历",subtitle:"门里门外",img:IMG.letin,
  text:"你压声问：「你是哪个？啷个弄成这样？」<br><br>他喘着答：「在下姓岳名雷，遭官府追了一路……姑娘，再不走我就要连累你了。」<br><br>姓岳——你心头一凛。硬是那个被追拿的岳家后人。可看他这样子，也确实造孽。",
  choices:[
    {text:"🚪 开门让他进来",eff:()=>{state.yue+=2;state.src++;},next:"letin"},
    {text:"😰 还是算咯，帮不到你",eff:()=>{state.yue--;},next:"refuse"}
  ]
};
nodes.letin={title:"开门 · 一念之善",subtitle:"",img:IMG.letin,
  text:"你咬咬牙，飞快拉开门栓，一把将他拉进来，反手闩上门。<br><br>他踉跄低声：「多谢姑娘……在下岳雷，不敢连累姑娘，只求躲一哈哈就走。」<br><br>岳雷——你心里一紧。城里告示要追的不就是岳家后人么？可你都把他拉进来了，总不能又赶出去。<br><br><span class='hl'>你得赶紧找个地方把他藏起来。</span>",
  choices:[{text:"▶ 藏他到屋里",next:"hidec"}]
};
nodes.ignore={title:"结局 · 事败被抓",subtitle:"你没有伸出援手",img:IMG.caught,
  text:"你屏着呼吸缩回屋，不敢出声。外头脚步杂乱——「这边！搜！」「挨家挨户查！」<br><br>你从缝里看到那年轻人咬牙转身往巷子深处跑。没多久远处一声怒喝「站到！」接着打斗声，然后……安静了。<br><br>后来你听说，那天官府在城东抓住了那个姓岳的。<br><br><span class='hl'>【结局：事败被抓】</span>你虽未直接牵连，但每次想起那个早晨靠在篱笆边的年轻人，心头总缺了点啥。",
  choices:[{text:"🔄 重来一次",next:"start"}],
  onEnter:()=>{state.ending='事败被抓';showBar(false);}
};
nodes.refuse={title:"结局 · 家宅不宁",subtitle:"你选择了缩",img:IMG.restless,
  text:"你压声说：「对不住……我家就我一个姑娘家，实在不敢惹这个事……」<br><br>他眼里暗了一下，仍拱手：「多谢姑娘没告发。」转身踉跄去了。没多久外头喧哗——他被抓了。<br><br>晚黑哥哥回来说这事，拍大腿：「玉莲你糊涂啊！岳家那是忠良！」妈叹气，一句话没说。<br><br><span class='hl'>【结局：家宅不宁】</span>邻里说你见死不救，哥哥跟你吵了好几架，妈也病了一场。",
  choices:[{text:"🔄 重来一次",next:"start"}],
  onEnter:()=>{state.ending='家宅不宁';showBar(false);}
};

// 第二幕
nodes.hidec={title:"第二幕 · 险象环生",subtitle:"藏他到哪里？",img:IMG.ward_ext,
  text:"你拉着岳雷进了堂屋，心里飞速盘算——能藏人的有三处：<br><br><span class='hl'>① 大衣柜</span>——里屋，空间大，但官差搜里屋就危险。<br><span class='hl'>② 柴房</span>——后院柴火堆，不起眼，但有人抱柴就露馅。<br><span class='hl'>③ 床底下</span>——最方便，也最容易被一眼看到。<br><br>吆喝声已在巷口——你选哪个？",
  choices:[
    {text:"📦 藏进大衣柜",eff:()=>{state.yue++;state.src++;state.flags.sp='ward';},next:"hward"},
    {text:"🪵 藏进柴房",eff:()=>{state.yue++;state.flags.sp='wood';},next:"hwood"},
    {text:"🛏️ 藏到床底下",next:"hbed"}
  ]
};
nodes.hward={title:"藏进大衣柜",subtitle:"里屋·吱呀一声",img:IMG.ward_in,
  text:"你掀开柜门把岳雷推进去，挂着的衣裳挡住他身影。虚掩柜门，心跳如擂鼓。<br><br><span class='dlg'>「藏好了，千万别出声。」</span><br><br>你刚坐回窗下，院门就被拍响——「开门！查缉要犯！」<br><br>你深吸一口气去开门。两个官差站在门口。",
  choices:[
    {text:"😰 紧张解释家里没人",eff:()=>{state.src++;},next:"w_nerv"},
    {text:"😤 装不耐烦反呛",next:"w_angry"},
    {text:"🙂 镇定自若说就自己一人",eff:()=>{state.yue++;state.src--;},next:"w_calm"}
  ]
};
nodes.hwood={title:"藏进柴房",subtitle:"后院·柴堆后",img:IMG.wood,
  text:"你领他绕到后院柴房，扒开柴火让他蜷进去，再堆回原样。外面看完全看不出有人。<br><br><span class='dlg'>「委屈你一下。」</span>他低声：「姑娘大恩，岳某记下了。」<br><br>你回前院刚拿起针线，院门就被拍响——「开门！查缉要犯！」",
  choices:[
    {text:"😰 紧张说家里没人",next:"wd_nerv"},
    {text:"😤 装生气质问他们",next:"wd_angry"},
    {text:"🙂 镇定从容应对",eff:()=>{state.yue++;state.src--;},next:"wd_calm"}
  ]
};
nodes.hbed={title:"藏到床底下",subtitle:"最危险的地方……",img:IMG.bed,
  text:"你咬牙指里屋床：「钻进去！别出声！」岳雷二话不说翻身钻入，床单垂地刚好遮住。<br><br>你坐回窗下刚拿针线，院门被拍响——可你心里一直发毛：床底太容易被发现了……<br><br>你去开门，两个官差站在门口。",
  choices:[
    {text:"😰 紧张说就自己一人",eff:()=>{state.src+=2;},next:"b_nerv"},
    {text:"🙂 强装镇定反问啥事",eff:()=>{state.src+=1;},next:"b_calm"}
  ]
};
nodes.w_nerv={title:"搜查 · 心跳加速",subtitle:"官差进了院子",img:IMG.cops,
  text:"你紧张得声音发颤：「军爷……我家就我一个人……」官差眯眼打量你：「就你一个？屋头有没有藏人，搜了才晓得。」说着就要往里屋走。<br><br>你心里一凉——衣柜就在里屋……",
  choices:[
    {text:"😱 拦他说女儿闺房不能乱进",eff:()=>{state.src+=2;},next:"w_block"},
    {text:"😰 没办法，让他搜吧",next:"w_fail"}
  ]
};
nodes.w_angry={title:"搜查 · 怒斥官差",subtitle:"你可不是好欺负的",img:IMG.cops,
  text:"你一叉腰提高嗓门：「军爷！我一个姑娘家独门独户，你们这么大动静，让邻里看到我以后还怎么做人！」<br><br>官差一愣，旁边那个拉他：「算了，一个小姑娘。」领头哼一声：「行！但要是让我们知道你窝藏钦犯——有你好看！」两人走了。<br><br>你双腿一软。<span class='hl'>（搜查严格度上升。）</span>",
  choices:[{text:"▶ 去看岳雷",next:"m3"}],
  onEnter:()=>{state.src++;}
};
nodes.w_calm={title:"搜查 · 从容应对",subtitle:"你稳住了阵脚",img:IMG.cops,
  text:"你微微一笑：「军爷辛苦，小女子一人在家，确实没见过可疑的人。几位不信尽管看——只是屋里乱。」<br><br>你落落大方反倒让官差犹豫。领头扫一眼没见异常，摆手：「行了，去别家。见到可疑人来报。」<br><br>你关门靠上门板，长舒一口气。<span class='hl'>（搜查严格度降低。）</span>",
  choices:[{text:"▶ 检查岳雷",next:"m3"}]
};
nodes.wd_nerv={title:"搜查 · 心提到嗓子眼",subtitle:"官差去了后院",img:IMG.cops,
  text:"你结结巴巴说没人，那官差已大步往后院：「柴房门开着？我去看看。」<br><br>你心都跳出来——岳雷就在柴房！他走到柴房门口，往里看了一眼……",
  choices:[
    {text:"🙏 祈祷他没发现",next:"wd_res"},
    {text:"😰 跟去打圆场说堆的杂物",eff:()=>{state.yue++;},next:"wd_res"}
  ]
};
nodes.wd_res={title:"搜查 · 虚惊一场",subtitle:"柴堆掩护得好",img:IMG.wood,
  text:"官差在柴房门口扫一眼满当当柴火，皱眉：「这柴房够乱。」「是……烧柴多堆得杂。」你赶紧接话。<br><br>他没再细看，招呼同伴：「去下一家！」<br><br>你关好院门腿都软了。跑去柴房扒开柴火，岳雷探出头也是一脸冷汗。<span class='dlg'>「好险……姑娘机智。」</span>",
  choices:[{text:"▶ 让他出来透气",next:"m3"}]
};
nodes.wd_calm={title:"搜查 · 风平浪静",subtitle:"你从容不迫",img:IMG.cops,
  text:"你坦然开门微笑：「军爷辛苦咯，小女子一人在家屋头，没得好查的。」官差扫你一眼又看看院子——一切如常。「最近不太平，自己小心。」「哎一定一定。」<br><br>官差转身就走，连后院都没切。你去柴房把岳雷喊出来，他满眼感激。",
  choices:[{text:"▶ 总算安全咯",next:"m3"}]
};
nodes.wd_angry={title:"搜查 · 先声夺人",subtitle:"你反客为主",img:IMG.cops,
  text:"你一开门先发制人：「大白天吵吵嚷嚷，还让不让人安生！我一个姑娘家，你们这样像啥子话！」<br><br>官差被你一顿呛：「我们办案！你凶啥！」「办案就办案，我家又没藏人！要搜赶紧搜！」<br><br>你理直气壮反倒让官差觉得搜一个姑娘家没意思，随便看一眼就走了。",
  choices:[{text:"▶ 总算走了",next:"m3"}],
  onEnter:()=>{state.src++;}
};
nodes.b_nerv={title:"搜查 · 心惊胆战",subtitle:"床底最容易暴露",img:IMG.bed,
  text:"你开门，一个官差二话不说推开你往里闯：「搜！挨家挨户查！」他直奔里屋，站到床前弯下腰——",
  choices:[
    {text:"😱 赶紧拦说床下都是灰",next:"b_block"},
    {text:"😰 完了……听天由命",next:"b_fail"}
  ]
};
nodes.b_calm={title:"搜查 · 勉强稳住",subtitle:"但危险仍在",img:IMG.bed,
  text:"你尽量平静：「几位军爷啥事？我家就我一个人……」「少废话，搜！」官差大步进里屋，目光落在床上——床单垂地看着正常。他环顾一圈没掀床单。「行了，走吧。」<br><br>你松口气，但心里清楚——太险了。",
  choices:[{text:"▶ 喊岳雷出来",next:"m3"}]
};
nodes.w_fail={title:"💔 事败 · 柜中搜出",subtitle:"官差打开了衣柜",img:IMG.empty,
  text:"官差一把推开你大步进里屋，直接拉开柜门——岳雷从柜里跌出，脸色苍白。<br>「好哇！果然藏了人！」官差一拥而上把他反剪按地。岳雷看你一眼低声：<span class='dlg'>「姑娘……是我连累了你。」</span><br><br>你也因包庇被带去衙门。妈花钱打点才把你保出来。但岳雷……你再也没他消息。<br><br><span class='hl'>【结局：事败被抓】</span>",
  choices:[{text:"🔄 重来一次",next:"start"}],
  onEnter:()=>{state.ending='事败被抓';showBar(false);}
};
nodes.b_block={title:"💔 事败 · 床底搜出",subtitle:"你太紧张了",img:IMG.empty,
  text:"你急忙拉官差膀子：「军爷！床下都是灰，莫弄脏你衣裳……」官差狐疑看你——你这反应太刻意。他甩开你手，弯腰掀床单——岳雷蜷在床下，跟官差看个对眼。<br>「好大的胆子！出来！」<br><br>官差一拥而上。你也因包庇被带走。<br><br><span class='hl'>【结局：事败被抓】</span>",
  choices:[{text:"🔄 重来一次",next:"start"}],
  onEnter:()=>{state.ending='事败被抓';showBar(false);}
};
nodes.b_fail={title:"💔 事败 · 床底搜出",subtitle:"根本藏不住",img:IMG.empty,
  text:"官差弯腰掀床单，一眼看到蜷在下面的岳雷。「哼，还想藏！出来！」岳雷被拖出，官差一拥而上按住。他看你一眼，目光满是歉疚：<span class='dlg'>「对不住……」</span><br><br>你也因包庇被带去衙门。<br><br><span class='hl'>【结局：事败被抓】</span>",
  choices:[{text:"🔄 重来一次",next:"start"}],
  onEnter:()=>{state.ending='事败被抓';showBar(false);}
};
nodes.w_block={title:"拦住了 · 但官差起疑",subtitle:"他们记住了你",img:IMG.cops,
  text:"你拦在里屋门口，脸红到脖子根：「军爷……那是我闺房，不能进！」官差上下打量你，哼一声：「行，不进去——但你给老子记住，要是让我们晓得你窝藏钦犯，你这房子都得拆！」他走了，但你清楚——他们记住了你。<br><br><span class='hl'>（搜查严格度上升，可能杀回马枪。）</span>",
  choices:[{text:"▶ 处理后续",next:"m3"}],
  onEnter:()=>{state.src+=2;}
};

// 第三幕
nodes.m3={title:"第三幕 · 误会横生",subtitle:"屋漏偏逢连夜雨",img:IMG.brother,
  text:"你刚把岳雷从藏身处喊出来让他喝口水——院门突然被推开。<br><br><span class='dlg'>「玉莲！我回来了！集市散得早——」</span><br><br>是哥哥。你脑壳嗡的一声——岳雷还站在堂屋，手里端碗，衣裳破有血印。哥哥一步跨进来，看到陌生男人站在自家堂屋，脸色瞬间变了：<br><br><span class='dlg'>「你是哪个？！在老子屋头做啥子！玉莲，这是哪个？！」</span>",
  choices:[
    {text:"🗣️ 实话实说——他是遭追捕的忠良之后",next:"honest"},
    {text:"🤥 扯谎——远房亲戚路过借宿",eff:()=>{state.bro-=2;},next:"lie"},
    {text:"🤫 拉到一边悄声跟哥说实情",eff:()=>{state.bro++;state.yue++;},next:"whisper"}
  ]
};
nodes.honest={title:"实话实说",subtitle:"你对哥讲了实情",img:IMG.brother,
  text:"你深吸一口气：「哥，他是岳家后人岳雷，遭官府追捕跑到咱这儿。我实在不忍心看他被抓。」<br><br>哥哥脸色变了几变——大惊、皱眉、最后重重叹气。<br><span class='dlg'>「岳家的……你晓不晓得这是多大的事？包庇钦犯全家掉脑壳！」</span><br><br>他嘴上这么说，眼神扫过岳雷那身伤、那双疲惫却端正的眼睛——哥哥也是血性汉子。闷了一会儿低声问：<span class='dlg'>「那……你现在打算啷个办？」</span>",
  choices:[
    {text:"💪 求你帮他——一起想办法",eff:()=>{state.bro++;},next:"help"},
    {text:"😞 你怕连累就算了，我让他走",eff:()=>{state.yue--;},next:"giveup"}
  ]
};
nodes.lie={title:"撒谎 · 远房亲戚",subtitle:"你编了个谎话",img:IMG.brother,
  text:"你赶紧挤出笑：「哥！这是我……远房表舅家表哥，路过重庆来借宿！」<br><br>哥哥眯眼上下打量岳雷——那身血污风尘，哪像走亲戚？<br><span class='dlg'>「表舅家表哥？哪个表舅？我啷个不晓得？你莫不是诓我？」</span><br><br>他往前一步，盯着岳雷袖口血迹：<span class='dlg'>「这血咋回事？你到底是哪个？！」</span><br><br>谎言眼看要被戳穿——",
  choices:[
    {text:"🙏 说实话吧，瞒不住了",eff:()=>{state.bro--;},next:"honest"},
    {text:"😰 继续圆谎……",next:"liefail"}
  ]
};
nodes.liefail={title:"💔 谎言被戳穿",subtitle:"哥哥不好糊弄",img:IMG.grab,
  text:"你支吾着想圆，哥哥一把推开你，走到岳雷面前揪住他衣领：<br><span class='dlg'>「你到底是谁？不说清老子现在就去报官！」</span><br><br>岳雷没挣扎，平静看他一眼：「在下岳雷，岳家后人。令妹为救我，与令妹无关。要报官冲我来。」<br><br>哥哥愣住，慢慢松手，回头看你——气你撒谎，又气妹妹卷进这事。最终闷声道：<span class='dlg'>「……说吧，到底怎么回事。」</span>",
  choices:[{text:"▶ 从头解释",next:"honest"}],
  onEnter:()=>{state.bro-=2;}
};
nodes.whisper={title:"拉到一边 · 小声解释",subtitle:"你拉住哥胳膊",img:IMG.brother,
  text:"你没等哥发作，快步上前拉住他拽到院角，压声飞快说了一遍——他是谁、啷个来的、官差刚走、他身上有伤、你没法见死不救。<br><br>哥哥听着，怒气慢慢变成吃惊，最后一声长叹。<br><span class='dlg'>「你呀……胆子也太大了……」</span><br><br>他回头看一眼堂屋里那个身形笔挺的年轻人，低声补一句：<span class='dlg'>「……但你做得对。岳家的人，不能落到他们手里。」</span>",
  choices:[{text:"▶ 那现在啷个办？",next:"help"}]
};
nodes.giveup={title:"算了 · 让他走",subtitle:"你不想连累哥",img:IMG.brother,
  text:"你低头：「哥你要是不愿意……我就让他走，就当没遇过这个人。」<br><br>岳雷听到，放下碗拱手：「姑娘救命之恩，岳某来世再报。」转身要往外走。<br><br>哥哥突然开口：「站到。」沉默好久闷声道：<span class='dlg'>「……你这副样子出去，走不出半条街就要遭抓。到时候一审问你在哪待过——想害死我妹妹？」</span><br><br>他烦躁抓头：「留下来！老子想办法。」",
  choices:[{text:"▶ 商量办法",next:"help"}],
  onEnter:()=>{state.bro--;}
};
nodes.help={title:"啷个整？",subtitle:"三人围桌坐下",img:IMG.brother,
  text:"岳雷坐到条凳，哥哥皱眉在屋头踱步。窗外日头偏西，时间不多——官差说不定还会回来。<br><br>哥哥停下看你：<span class='dlg'>「玉莲，你说咋办？让他就这么走，还是想个法子送他出去？」</span>",
  choices:[
    {text:"🪵 让他扮卖柴伙计，跟哥出城",eff:()=>{state.bro++;},next:"woodsel"},
    {text:"📜 写路条，冒充送信驿卒",eff:()=>{state.yue++;},next:"courier"},
    {text:"🌙 先藏一夜，明早天不亮走",eff:()=>{state.src++;},next:"overnight"}
  ]
};
nodes.woodsel={title:"扮成卖柴伙计",subtitle:"跟哥一起出城",img:IMG.woodsel,
  text:"哥哥拍板：「行！让他扮成跟我一起卖柴的伙计。我天天出城，守门的都认得我，不会细查。」<br><br>他翻件旧衣裳给岳雷换上，又匀一捆柴让他挑。岳雷换好真有几分农家样，朝你深揖：<span class='dlg'>「姑娘大恩，岳某铭记。他日有命必当登门叩谢。」</span><br><br>哥哥吆喝开院门，岳雷低头挑柴跟在后。你站门边，看他们背影消失在巷口……<br><br>后来你听说，那天傍晚两个卖柴的出了城，守门的还跟其中一个开玩笑「今儿柴捆得够紧哈」。",
  choices:[{text:"▶ 看结局",next:"assess"}]
};
nodes.courier={title:"冒充驿卒送信",subtitle:"路条风险不小",img:IMG.courier,
  text:"你说：「我写张路条，就说他是往重庆府送公文的驿卒。官差不敢拦送公文的。」<br><br>哥惊讶看你：「你还会写这个？」「爹以前教过我认字，也教过几种笔迹。」你找出爹留的纸笔，模仿县衙公文格式写得飞快——天黑前糊弄守门够用。<br><br>岳雷接过路条，眼底带着深深的惊讶和敬意：「姑娘不仅心善，还有恁大胆识才学……」他把路条贴身收好。<br><br>临出门他又回头看你一眼——那眼里有感激、欣赏，还有点别的啥。",
  choices:[{text:"▶ 看他能否出城",next:"assess"}],
  onEnter:()=>{ if(state.inv.indexOf('岳雷的半块玉佩')<0) state.inv.push('岳雷的半块玉佩'); }
};
nodes.overnight={title:"留宿一夜",subtitle:"等天不亮再走",img:IMG.pendant,
  text:"你说：「现在走太急，万一城门口盘查严？不如先藏一夜，明早天不亮混出去。」<br><br>你把岳雷安置柴房，铺厚稻草，抱旧被过去。他坐草上接过饼和水，低声：<span class='dlg'>「姑娘……你为何要如此帮我？」</span><br><br>你沉默一会儿：「因为你是岳家的人。岳家是忠良，不该落这下场。」<br><br>夜深了你睡不着。子时刚过你偷偷去柴房——他也没睡，靠墙握着半块玉佩发呆。见你来，他微怔，把玉佩递过来：<br><span class='dlg'>「……这个给你。我娘留给我的，说以后给重要的人。你留着，当是个念想。」</span>",
  choices:[{text:"▶ 收下玉佩",next:"pendant"},
  ],
  onEnter:()=>{state.yue+=2;}
};
nodes.pendant={title:"玉佩 · 赠予",subtitle:"他把最重要的东西给了你",img:IMG.pendant,
  text:"你接过那半块玉佩，入手温润。<br><br>你想说点啥，喉咙发紧，最后只挤出一句：<span class='dlg'>「……我等你回来取。」</span><br><br>他笑了笑——这是你第一次看到他真正的笑，烛光下很好看。<br><br>天没亮哥就把岳雷叫起。你站在门后，看两个身影一前一后消失在晨雾里。手里那半块玉佩，被你攥得发烫。<br><br>后来你听说，那天早上城门刚开，两个农人挑担出了城，守门打哈欠没多问。",
  choices:[{text:"▶ 看结局",next:"assess"}],
  onEnter:()=>{ if(state.inv.indexOf('岳雷的半块玉佩')<0) state.inv.push('岳雷的半块玉佩'); }
};

// 第四幕 结局判定
nodes.assess={title:"第四幕 · 尘埃落定",subtitle:"命运的分岔路口",img:IMG.start,
  text:"一切都归于平静。<br><br>你坐到院坝里，手里捏着针线，一个字也绣不进去。<br><br>风从院墙吹进来，吹得竹叶沙沙响。<br><br>你的选择、勇气、善良——所有这些最后汇成了这么一个故事……<br><br><span class='hl'>我们来看，命运给你的答案是啥——</span>",
  choices:[{text:"🔮 揭晓结局",next:"judge"}]
};
nodes.judge={title:"🏮 结局",subtitle:"天意难测，人心可鉴",img:"",
  text:"",choices:[],
  onEnter:()=>{
    const hasP=state.inv.indexOf('岳雷的半块玉佩')>=0;
    let t='';
    if(hasP && state.yue>=5 && state.bro>=2){
      t=`——<span class='hl'>【结局：共创新篇启 · 隐藏结局】</span><br><br>三个月后风声松了。一天傍晚你在院里收衣裳，院门被敲响。<br><br>开门——一个风尘仆仆的年轻人站门外，粗布衣裳，但眉目间那股英气你一眼认出。<br><br><span class='dlg'>「玉莲姑娘，岳某……来取玉佩了。」</span><br><br>他从怀里掏出另一半，两块合到一起——严丝合缝。<br><br><span class='dlg'>「我投了义军，现在安顿下来了。今日来，是想问你一句——」</span><br><br><span class='dlg' style='font-size:17px;'>「你愿不愿意，跟我走？」</span><br><br>晚风过竹篱笆，你眼眶红了，但你笑了。你点了点头。<br><br>——<span class='hl'>「柜中缘」终 · 共创新篇启</span>——`;
      document.getElementById('frame-img').src=IMG.reunion;
    } else if(state.yue>=4 && state.bro>=1){
      t=`——<span class='hl'>【结局：良缘定】</span><br><br>岳雷成功出城投奔义军。<br><br>半年后，一封没署名的信夹在张婆婆菜篮子里送到你手上。信上只有一行：<br><br><span class='dlg'>「等天下太平了，岳某必回渝城，寻那位柜中藏人的姑娘。」</span><br><br>你把信叠好放进妆奁最底层。从那天起，你每天都在院里多坐一会儿。<br><br>直到某年春天，一个身影出现在篱笆外头——<br><br><span class='hl'>他回来了。</span><br><br>——<span class='hl'>「柜中缘」终 · 良缘定</span>——`;
      document.getElementById('frame-img').src=IMG.letter;
    } else if(state.yue>=3){
      t=`——<span class='hl'>【结局：江湖别】</span><br><br>岳雷安全离开重庆。<br><br>此后好几年，你偶尔从路过商人口中听到些消息——南边义军里有个姓岳的年轻人，打仗勇猛，很得人心。<br><br>你每次听到都微微一笑，低头继续纳鞋底。<br><br>你没再见过他。但你知道，那个春天午后你开门拉进来的沾血年轻人——他活得很好。这就够了。<br><br>——<span class='hl'>「柜中缘」终 · 江湖别</span>——`;
      document.getElementById('frame-img').src=IMG.wander;
    } else if(state.bro>=2){
      t=`——<span class='hl'>【结局：兄妹守】</span><br><br>岳雷走后，哥跟你好好谈了一回。<br><br><span class='dlg'>「玉莲，你做的是对头事。但以后有事要跟哥商量，别一个人扛。你是我妹，天塌下来哥跟你一起扛。」</span><br><br>你红眼眶点头。从那以后哥更把你当大人，赶集回来会给你带一包花生糖。<br><br>日子一天天过，你依然在院里纳鞋底，只是偶尔抬头看看院门口——像是在等啥人。<br><br>——<span class='hl'>「柜中缘」终 · 兄妹守</span>——`;
      document.getElementById('frame-img').src=IMG.siblings;
    } else if(state.ending==='事败被抓' || state.yue<=1){
      t=`——<span class='hl'>【结局：事败被抓】</span><br><br>官差最后还是查到了你屋头。岳雷遭抓，你也因包庇被带去衙门。母亲求人花了大半积蓄才把你保出来。<br><br>你回家那天推开门——院子空荡荡，灶上红苕稀饭早凉透了。<br><br>此后你常想起那个靠在篱笆边喘气的年轻人。如果当时……<br><br><span class='hl'>但故事没得如果。</span><br><br>——<span class='hl'>「柜中缘」终 · 事败被抓</span>——`;
      document.getElementById('frame-img').src=IMG.empty;
    } else {
      t=`——<span class='hl'>【结局：家宅不宁】</span><br><br>你没出手救岳雷。那天事后传出去，邻里都说你胆小怕事见死不救。<br><br>哥气得跟你吵好几次：「你平时胆子不是挺大的嘛！啷个到关键时候就怂！」妈叹气啥都没说。<br><br>晚上你一个人躺床上翻来覆去睡不着。你没做错啥——你只是保护了自己和这个家。<br><br>但是为啥子……心头空落落的？<br><br>——<span class='hl'>「柜中缘」终 · 家宅不宁</span>——`;
      document.getElementById('frame-img').src=IMG.restless;
    }
    document.getElementById('text').innerHTML=t;
    document.getElementById('choices').innerHTML='<button class="choice" onclick="restart()">🔄 再玩一回？</button>';
    showBar(true); updBar();
  }
};
</script>
